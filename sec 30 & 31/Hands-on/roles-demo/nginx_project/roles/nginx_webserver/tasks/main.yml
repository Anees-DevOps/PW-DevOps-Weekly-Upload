- name: Install nginx
  apt:
    name: nginx
    state: present
  notify: 
    - restart nginx

- name: Deploy custom index.html
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify:
    - restart nginx

- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes